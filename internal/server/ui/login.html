{{define "content"}}
<div class="login">
  <h1>trackd<span class="cursor">▮</span></h1>
  <p>Paste an API token to view the board.</p>
  {{if .Error}}<p class="login-error">{{.Error}}</p>{{end}}
  <form method="post" action="/ui/login">
    <input type="password" name="token" placeholder="td_…" autofocus autocomplete="off" required>
    <button type="submit">View board</button>
  </form>
  <p class="hint">Tokens are minted with: trackd token add &lt;name&gt;</p>
</div>
{{end}}
