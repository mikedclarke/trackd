<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trackd · {{.Title}}</title>
<link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
<header class="topbar">
  <a class="wordmark" href="/">trackd<span class="cursor">▮</span></a>
  {{if .Workspace}}<span class="workspace">{{.Workspace}}</span>{{end}}
  <nav class="topnav">
    <a href="/healthz">health</a>
    <a href="/ui/logout">sign out</a>
  </nav>
</header>
<main>
{{template "content" .}}
</main>
</body>
</html>
{{define "tabs"}}
<nav class="tabs">
  <a class="tab{{if not .Current}} active{{end}}" href="/">board</a>
  {{$current := .Current}}
  {{range .Views}}<a class="tab{{if eq .Name $current}} active{{end}}{{if not .Shared}} private{{end}}" href="/ui/view/{{.Name}}" {{if .Description}}title="{{.Description}}"{{end}}>{{.Name}}</a>{{end}}
  <a class="tab new" href="/ui/views/new" title="save a filter as a view">+ view</a>
</nav>
{{end}}
